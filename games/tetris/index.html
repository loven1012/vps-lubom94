<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Tetris</title>
<style>
  body{margin:0;background:#111;color:#eee;font-family:sans-serif;display:flex;flex-direction:column;align-items:center;touch-action:manipulation}
  #info{display:flex;gap:24px;margin:8px;font-size:18px}
  canvas{background:#000;border:2px solid #444;max-height:70vh}
  #pad{display:grid;grid-template-columns:repeat(5,56px);gap:8px;margin:12px}
  #pad button{height:56px;font-size:22px;border:0;border-radius:10px;background:#333;color:#fff}
  #msg{height:24px;color:#fc0}
</style>
</head>
<body>
<div id="info"><span>Điểm: <b id="score">0</b></span><span>Dòng: <b id="lines">0</b></span><span>Cấp: <b id="level">1</b></span></div>
<canvas id="c" width="240" height="480"></canvas>
<div id="msg">Nhấn Enter / nút ▶ để bắt đầu</div>
<div id="pad">
  <button data-k="left">◀</button><button data-k="rotate">⟳</button><button data-k="right">▶</button>
  <button data-k="drop">⤓</button><button data-k="start">⏯</button>
</div>
<script>
const COLS=10, ROWS=20, S=24;
const ctx=document.getElementById('c').getContext('2d');
const COLORS=[null,'#0ff','#00f','#f90','#ff0','#0f0','#a0f','#f00'];
const SHAPES=[
  [[1,1,1,1]],
  [[2,0,0],[2,2,2]],
  [[0,0,3],[3,3,3]],
  [[4,4],[4,4]],
  [[0,5,5],[5,5,0]],
  [[0,6,0],[6,6,6]],
  [[7,7,0],[0,7,7]]
];
let board, piece, score, lines, level, dropMs, last, over, running;

const $=id=>document.getElementById(id);
const rotate=m=>m[0].map((_,i)=>m.map(r=>r[i]).reverse());
const collide=(m,x,y)=>m.some((r,j)=>r.some((v,i)=>v&&(x+i<0||x+i>=COLS||y+j>=ROWS||(y+j>=0&&board[y+j][x+i]))));

function spawn(){
  const m=SHAPES[Math.floor(Math.random()*SHAPES.length)].map(r=>[...r]);
  piece={m,x:Math.floor((COLS-m[0].length)/2),y:0};
  if(collide(m,piece.x,piece.y)){over=true;running=false;$('msg').textContent='Thua rồi! Nhấn Enter để chơi lại';}
}
function reset(){
  board=Array.from({length:ROWS},()=>Array(COLS).fill(0));
  score=lines=0;level=1;dropMs=800;over=false;running=true;last=performance.now();
  $('msg').textContent='';update();spawn();
}
function update(){$('score').textContent=score;$('lines').textContent=lines;$('level').textContent=level;}
function lock(){
  piece.m.forEach((r,j)=>r.forEach((v,i)=>{if(v&&piece.y+j>=0)board[piece.y+j][piece.x+i]=v;}));
  let n=0;
  for(let y=ROWS-1;y>=0;y--){
    if(board[y].every(v=>v)){board.splice(y,1);board.unshift(Array(COLS).fill(0));n++;y++;}
  }
  if(n){score+=[0,100,300,500,800][n]*level;lines+=n;level=1+Math.floor(lines/10);dropMs=Math.max(100,800-(level-1)*70);update();}
  spawn();
}
function move(dx){if(!collide(piece.m,piece.x+dx,piece.y))piece.x+=dx;}
function down(){if(!collide(piece.m,piece.x,piece.y+1))piece.y++;else lock();}
function turn(){
  const r=rotate(piece.m);
  for(const k of [0,-1,1,-2,2]){if(!collide(r,piece.x+k,piece.y)){piece.m=r;piece.x+=k;return;}}
}
function hardDrop(){while(!collide(piece.m,piece.x,piece.y+1)){piece.y++;score+=2;}lock();update();}

function draw(){
  ctx.clearRect(0,0,240,480);
  const cell=(x,y,v)=>{ctx.fillStyle=COLORS[v];ctx.fillRect(x*S+1,y*S+1,S-2,S-2);};
  board.forEach((r,y)=>r.forEach((v,x)=>v&&cell(x,y,v)));
  if(piece)piece.m.forEach((r,j)=>r.forEach((v,i)=>v&&cell(piece.x+i,piece.y+j,v)));
}
function loop(t){
  if(running&&t-last>dropMs){down();last=t;}
  draw();requestAnimationFrame(loop);
}
function act(k){
  if(k==='start'){if(over||!running&&!board)reset();else running=!running;return;}
  if(!running)return;
  if(k==='left')move(-1);else if(k==='right')move(1);else if(k==='rotate')turn();
  else if(k==='soft')down();else if(k==='drop')hardDrop();
}
addEventListener('keydown',e=>{
  const map={ArrowLeft:'left',ArrowRight:'right',ArrowUp:'rotate',ArrowDown:'soft',' ':'drop',Enter:'start',p:'start'};
  if(map[e.key]){e.preventDefault();act(map[e.key]);}
});
document.querySelectorAll('#pad button').forEach(b=>b.addEventListener('click',()=>act(b.dataset.k)));
board=Array.from({length:ROWS},()=>Array(COLS).fill(0));
requestAnimationFrame(loop);
</script>
</body>
</html>
